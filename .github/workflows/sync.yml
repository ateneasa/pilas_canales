name: Sync to valverdino

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to valverdino
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: https://github.com/valverdino/pilas_canales.git
          ssh_private_key: ${{ secrets.VALVERDINO_SSH_KEY }}
